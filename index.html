<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Agenda Pro</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Fuente moderna para un look profesional -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOGIN -->
  <main id="view-auth" class="auth hidden">
    <div class="brand glass">📅</div>
    <h1>Mi Agenda</h1>
    <p class="muted">Organiza tu vida de forma increíble.</p>
    <form id="auth-form" class="card glass stack">
      <input type="email" name="email" placeholder="Correo" required autocomplete="email">
      <input type="password" name="password" placeholder="Contraseña" required minlength="6" autocomplete="current-password">
      <button class="btn primary" data-mode="login">Entrar</button>
      <button class="btn ghost" data-mode="signup" formnovalidate>Crear cuenta</button>
    </form>
  </main>

  <!-- APP -->
  <div id="view-app" class="hidden">
    <header class="topbar glass">
      <div class="brand-row">
        <span class="brand-icon">📅</span>
        <div>
          <h1>Mi Agenda</h1>
          <!-- Reloj en vivo -->
          <div id="live-clock" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;"></div>
        </div>
      </div>
      <div class="row">
        <button id="btn-theme" class="icon-btn" title="Cambiar tema">🌙</button>
        <button id="btn-push" class="icon-btn" title="Activar notificaciones">🔔</button>
        <button id="btn-logout" class="icon-btn" title="Salir">⎋</button>
      </div>
    </header>

    <main class="container">
      <!-- PESTAÑA: HOY / PRÓXIMOS -->
      <section id="tab-hoy">
        <div class="filters">
          <input id="search" type="search" placeholder="🔎 Buscar evento, lugar, nota…">
          <select id="filter-kind">
            <option value="todos">Todos</option>
            <option value="evento">🎉 Eventos</option>
            <option value="clase">📚 Clases</option>
            <option value="cita">🩺 Citas</option>
          </select>
        </div>
        <div id="agenda-list"></div>
      </section>

      <!-- PESTAÑA: MES -->
      <section id="tab-mes" class="hidden">
        <div class="month-header glass">
          <button class="icon-btn" id="prev-month">‹</button>
          <h2 id="month-title">Mes</h2>
          <button class="icon-btn" id="next-month">›</button>
        </div>
        <div class="weekdays">
          <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div id="calendar" class="calendar glass"></div>
        <div id="day-detail" class="day-detail"></div>
      </section>

      <!-- PESTAÑA: HORARIO -->
      <section id="tab-horario" class="hidden">
        <div id="schedule"></div>
      </section>
    </main>

    <!-- Bottom nav flotante -->
    <nav class="bottom-nav glass">
      <button class="nav-item active" data-tab="hoy">
        <span class="nav-ico">📋</span><span>Hoy</span>
      </button>
      <button class="nav-item" data-tab="mes">
        <span class="nav-ico">🗓️</span><span>Mes</span>
      </button>
      <button class="nav-item" data-tab="horario">
        <span class="nav-ico">🔁</span><span>Horario</span>
      </button>
      <button class="nav-item" id="fab-nav">
        <span class="nav-ico fab-ico">＋</span>
      </button>
    </nav>
  </div>

  <!-- FORMULARIO -->
  <dialog id="dlg" class="glass">
    <form id="event-form" class="stack">
      <h2 id="dlg-title">Nuevo evento</h2>
      <input type="hidden" name="event_id">

      <label>Tipo
        <select name="kind">
          <option value="evento">🎉 Evento</option>
          <option value="clase">📚 Clase</option>
          <option value="cita">🩺 Cita</option>
        </select>
      </label>

      <label>Título
        <input name="titulo" required placeholder="Ej: Concierto, Cálculo II, Dentista">
      </label>

      <div class="grid2">
        <label>Fecha <input type="date" name="event_date" required></label>
        <label>Hora inicio <input type="time" name="start_time" required></label>
      </div>
      <div class="grid2">
        <label>Hora fin <input type="time" name="end_time"></label>
        <label>Recordarme
          <select name="remind">
            <option value="-1">No</option>
            <option value="0">A la hora</option>
            <option value="10">10 min antes</option>
            <option value="30" selected>30 min antes</option>
            <option value="60">1 hora antes</option>
            <option value="120">2 horas antes</option>
            <option value="1440">1 día antes</option>
          </select>
        </label>
      </div>

      <label class="check"><input type="checkbox" name="repeat"> 🔁 Se repite cada semana (ideal para clases)</label>

      <label>Lugar / aula
        <input name="lugar" placeholder="Opcional">
      </label>
      <label>Notas
        <textarea name="notas" rows="3" placeholder="Opcional"></textarea>
      </label>
      <label>Links (uno por línea)
        <textarea name="links" rows="3" placeholder="https://..."></textarea>
      </label>

      <div id="existing-files" class="chips"></div>
      <label>Fotos y archivos
        <input type="file" name="attach" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">
      </label>

      <div class="row end">
        <button type="button" class="btn ghost" id="btn-cancel">Cancelar</button>
        <button class="btn primary" id="btn-save">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
